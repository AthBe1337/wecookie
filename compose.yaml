services:
  wechat:
    build:
      context: .
      args:
        WECHAT_DEB_URL: https://dldir1v6.qq.com/weixin/Universal/Linux/WeChatLinux_arm64.deb
    image: wecookie/wechat-arm64-test:local
    container_name: wecookie-wechat-test
    restart: unless-stopped
    environment:
      DISPLAY: :99
      SCREEN_GEOMETRY: 1280x800x24
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
      HTTP_PROXY: http://proxy:8080
      HTTPS_PROXY: http://proxy:8080
      ALL_PROXY: http://proxy:8080
      NO_PROXY: localhost,127.0.0.1,proxy,api
    volumes:
      - wechat-home:/home/wechat
      - wechat-screens:/tmp/screens
      - x11-socket:/tmp/.X11-unix
      - cookie-data:/mitmproxy-state:ro
    depends_on:
      proxy:
        condition: service_started
      x11-init:
        condition: service_completed_successfully
    # No ports are published. The first-login screenshot is copied out with:
    # docker cp wecookie-wechat-test:/tmp/screens/qr.png ./qr.png

  proxy:
    image: mitmproxy/mitmproxy:latest
    command:
      - mitmdump
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - "8080"
      - --set
      - confdir=/data/mitmproxy
      - -s
      - /addons/cookie_capture.py
    environment:
      TARGET_DOMAINS: ${TARGET_DOMAINS:-wx.weiweixiao.net}
      COOKIE_FILE: /data/latest-cookie.json
    volumes:
      - cookie-data:/data
      - ./docker/cookie_capture.py:/addons/cookie_capture.py:ro
    depends_on:
      cookie-init:
        condition: service_completed_successfully

  x11-init:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /tmp/.X11-unix && chmod 1777 /tmp/.X11-unix"]
    volumes:
      - x11-socket:/tmp/.X11-unix

  cookie-init:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /data && chmod 1777 /data"]
    volumes:
      - cookie-data:/data

  api:
    build:
      context: ./docker
      dockerfile: api.Dockerfile
    environment:
      DISPLAY: :99
      HTTP_PORT: 8090
      API_TOKEN: ${API_TOKEN:-}
      COOKIE_FILE: /data/latest-cookie.json
      COOKIE_TIMEOUT: ${COOKIE_TIMEOUT:-20}
      COOKIE_SETTLE_SECONDS: ${COOKIE_SETTLE_SECONDS:-3.0}
      COOKIE_REUSE_WAIT: ${COOKIE_REUSE_WAIT:-6.0}
      PINNED_CHAT_X: ${PINNED_CHAT_X:-350}
      PINNED_CHAT_Y: ${PINNED_CHAT_Y:-185}
      OPEN_LINK_X: ${OPEN_LINK_X:-700}
      OPEN_LINK_Y: ${OPEN_LINK_Y:-238}
      WINDOW_HIDE_DELAY: ${WINDOW_HIDE_DELAY:-0.5}
      FOCUS_DELAY: ${FOCUS_DELAY:-0.8}
      CHAT_OPEN_DELAY: ${CHAT_OPEN_DELAY:-1.5}
      MAIN_WINDOW_WIDTH: ${MAIN_WINDOW_WIDTH:-917}
      MAIN_WINDOW_HEIGHT: ${MAIN_WINDOW_HEIGHT:-667}
    ports:
      - "${HTTP_PORT:-8090}:8090"
    volumes:
      - x11-socket:/tmp/.X11-unix
      - cookie-data:/data
    depends_on:
      wechat:
        condition: service_started

volumes:
  wechat-home:
  wechat-screens:
  x11-socket:
  cookie-data:
